// ── db 모듈: Entity + Repository 전용 (라이브러리 모듈) ─────
// java-library 플러그인: api(전이O) / implementation(전이X) 구분 가능
plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:4.0.4"
    }
}

dependencies {
    // ── api: 소비자(application)에게 전이됨 ──────────────────
    // application 모듈에서 @Transactional, @Entity, JpaRepository 등
    // 모두 사용할 수 있도록 api로 노출
    api 'org.springframework.boot:spring-boot-starter-data-jpa'

    // ── implementation: 전이 안됨 (런타임 전용) ───────────────
    // MySQL 드라이버는 런타임에만 필요, 소비자에게 노출 불필요
    runtimeOnly 'com.mysql:mysql-connector-j'

    // ── Lombok (버전은 BOM 관리) ──────────────────────────────
    compileOnly         'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}

// application 모듈이 project(':db')로 classpath 참조 가능하도록
jar {
    enabled = true
}
